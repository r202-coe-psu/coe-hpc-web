[project]
name = "coe-hpc-web"
version = "1.0.0"
description = "CoE HPC website (Pelican + Tailwind/DaisyUI, Slurm-backed cluster status)"
authors = [{ name = "CoE HPC Team" }]
requires-python = ">=3.11,<4"
dependencies = [
    "pelican[markdown] (>=4.12,<5)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

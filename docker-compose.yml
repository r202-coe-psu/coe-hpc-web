# Production deployment for the CoE HPC website.
#
#   docker compose up -d --build     # build the image and start (or update) the site
#   docker compose logs -f web       # follow nginx logs
#   docker compose down              # stop and remove the container
#
# The host port defaults to 8000; override with HOST_PORT=80 docker compose up -d
# (or put HOST_PORT=... in a .env file next to this one).
#
# The Slurm cluster status is baked in at build time from
# content/data/cluster_status.json (or the sample fallback). Refresh the snapshot
# and re-run `docker compose up -d --build` to publish new data -- see README.md.

name: coe-hpc-web

services:
  web:
    build: .
    ports:
      - "9080:80"
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Production deployment for the CoE HPC website.
#
#   docker compose up -d --build     # build the image and start (or update) the site
#   docker compose logs -f web       # follow nginx logs
#   docker compose down              # stop and remove the container
#
# The host port defaults to 8000; override with HOST_PORT=80 docker compose up -d
# (or put HOST_PORT=... in a .env file next to this one).
#
# The `updater` service keeps the homepage Slurm status current: every
# SLURM_REFRESH_SECONDS (default 300) it SSHes to the Slurm login node, runs
# scontrol/squeue, rebuilds the site and syncs it into the `site` volume that
# nginx serves. Settings (put them in .env next to this file):
#
#   SLURM_SSH_USER=<your nillapat username>     (default: $USER)
#   SLURM_SSH_KEY=/home/<you>/.ssh/id_ed25519   (passwordless key; default ~/.ssh/id_ed25519)
#   SLURM_HOST_NAME=nillapat.coe.psu.ac.th
#   SLURM_REFRESH_SECONDS=300

name: coe-hpc-web

services:
  web:
    build:
      context: .
      args:
        # Public URL of the site, e.g. SITEURL=https://hpc.coe.psu.ac.th in .env.
        # Leave empty to use root-relative links that work on any host/port.
        SITEURL: ${SITEURL:-}
    ports:
      - "9080:80"
    volumes:
      # Seeded from the image's prebuilt site on first start, then kept
      # up to date by the updater service.
      - site:/usr/share/nginx/html
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  updater:
    build:
      context: .
      target: updater
    environment:
      SITEURL: ${SITEURL:-}
      SLURM_HOST: ${SLURM_SSH_USER:-${USER}}@${SLURM_HOST_NAME:-nillapat.coe.psu.ac.th}
      SLURM_CLUSTER_NAME: ${SLURM_CLUSTER_NAME:-Nillapat}
      SLURM_REFRESH_SECONDS: ${SLURM_REFRESH_SECONDS:-300}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - site:/site
      - ${SLURM_SSH_KEY:-${HOME}/.ssh/id_ed25519}:/run/secrets/slurm_ssh_key:ro
      - ${HOME}/.ssh/known_hosts:/run/secrets/known_hosts:ro
    depends_on:
      - web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  site:
